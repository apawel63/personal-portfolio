<div class="site-shell">
  <app-sidebar [activeSection]="activeSection"></app-sidebar>

  <main class="content" *ngIf="content$ | async as content; else loading">
    <app-about-section [skills]="content.skills"></app-about-section>
    <app-experience-section [experience]="content.experience"></app-experience-section>
    <app-projects-section [projects]="content.projects"></app-projects-section>
    <app-education-section [education]="content.education"></app-education-section>
  </main>

  <ng-template #loading>
    <main class="content loading-state" aria-live="polite">
      <p>Loading portfolio content...</p>
    </main>
  </ng-template>
</div>
