<section id="projects" class="section-block" aria-labelledby="projects-heading">
  <p class="section-kicker">03</p>
  <h2 id="projects-heading">Projects</h2>

  <div class="project-grid">
    <article class="project-card" *ngFor="let project of projects | slice:0:visibleCount">
      <div class="project-body">
        <p class="project-category">{{ project.category }}</p>
        <h3>{{ project.title }}</h3>

        <div class="project-image">
          <img [src]="project.imageUrl" [alt]="project.title + ' preview'">
        </div>

        <div class="card-section">
          <h4 class="card-section-label">Description</h4>
          <p
            class="project-description"
            [class.expanded]="expandedDescriptions.has(project.id)"
            [class.is-truncatable]="isDescriptionTruncatable(project.description)"
            (click)="isDescriptionTruncatable(project.description) && toggleDescription(project.id)"
            [title]="isDescriptionTruncatable(project.description) ? (expandedDescriptions.has(project.id) ? 'Click to collapse' : 'Click to expand') : ''">
            {{ project.description }}
          </p>
        </div>

        <div class="card-section" *ngIf="project.technologies && project.technologies.length">
          <h4 class="card-section-label">Technologies</h4>
          <ul class="pill-list">
            <li *ngFor="let tech of project.technologies">
              <ng-container *ngIf="tech.url; else noLink">
                <a [href]="tech.url" target="_blank" rel="noopener noreferrer">
                  <i [ngClass]="tech.icon?.cssClass" aria-hidden="true"></i>{{ tech.name }}
                </a>
              </ng-container>
              <ng-template #noLink>
                <i [ngClass]="tech.icon?.cssClass" aria-hidden="true"></i>{{ tech.name }}
              </ng-template>
            </li>
          </ul>
        </div>

        <div class="card-section" *ngIf="project.links && project.links.length">
          <h4 class="card-section-label">Links</h4>
          <div class="icon-link-list" [attr.aria-label]="project.title + ' links'">
            <a
              *ngFor="let link of project.links"
              [href]="link.url"
              target="_blank"
              rel="noreferrer"
              [attr.aria-label]="link.name"
              [title]="link.name">
              <i [ngClass]="link.icon?.cssClass" aria-hidden="true"></i>
            </a>
          </div>
        </div>

      </div>
    </article>
  </div>

  <div class="load-more-row" *ngIf="visibleCount < projects.length">
    <button type="button" class="load-more-btn" (click)="loadMore(projects.length)">
      Load more
    </button>
  </div>
</section>
