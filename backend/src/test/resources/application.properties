spring.cloud.azure.keyvault.secret.property-source-enabled=false
spring.datasource.url=jdbc:sqlserver://localhost:1433;database=portfolioapp-db-dev;encrypt=true;trustServerCertificate=true;loginTimeout=1;authentication=ActiveDirectoryDefault;
spring.datasource.pool-warmup.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
