name: Release Frontend to SWA Dev

on:
  workflow_run:
    workflows: ["Build Frontend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: swa-dev
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Resolve build run
        id: resolve-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            RUN_INFO=$(gh api "repos/${{ github.repository }}/actions/workflows/build-frontend.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0] | {sha: .head_sha, id: .id}')
            SHA=$(echo $RUN_INFO | jq -r '.sha')
            RUN_ID=$(echo $RUN_INFO | jq -r '.id')
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Deploying SHA $SHA from build run $RUN_ID"

      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ steps.resolve-run.outputs.run_id }} \
            --repo ${{ github.repository }} \
            --name frontend-build \
            --dir dist

      - name: Deploy to SWA
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: dist
          output_location: ""
